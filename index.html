<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Realm — Server Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17120d;
    --bg-2: #1f1811;
    --parchment: #ded0aa;
    --parchment-dim: #a89873;
    --gold: #c9a227;
    --gold-bright: #e8c85a;
    --claimed: #3f5a41;
    --unclaimed: #4a463f;
    --siege: #9c3131;
    --siege-bright: #d84545;
    --line: #3a3226;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% 0%, #241b12 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, #201810 0%, transparent 55%),
      var(--bg);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    min-height:100vh;
  }

  .wrap{max-width:1180px; margin:0 auto; padding:32px 20px 80px;}

  header{
    display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:28px; gap:12px;
  }
  h1{
    font-family:'Cinzel', serif; font-weight:700; letter-spacing:0.06em;
    font-size:clamp(28px, 4vw, 40px); margin:0; color:var(--gold-bright);
    text-shadow: 0 0 22px rgba(201,162,39,0.25);
  }
  header .sub{color:var(--parchment-dim); font-style:italic; font-size:15px;}

  /* ---- siege alert bar ---- */
  #siegeBar{
    border:1px solid var(--line); background:linear-gradient(180deg, #241414, #1a1010);
    border-left:4px solid var(--siege-bright);
    padding:12px 18px; margin-bottom:26px; border-radius:2px;
    font-family:'Cinzel', serif; font-size:13px; letter-spacing:0.04em;
    color:var(--parchment-dim);
  }
  #siegeBar.active{ color:var(--siege-bright); border-left-color:var(--siege-bright); }
  #siegeBar .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--parchment-dim); margin-right:10px; position:relative; top:-1px;
  }
  #siegeBar.active .dot{ background:var(--siege-bright); box-shadow:0 0 8px var(--siege-bright); animation:pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  /* ---- layout ---- */
  .layout{ display:grid; grid-template-columns: 1.6fr 1fr; gap:28px; }
  @media (max-width: 900px){ .layout{ grid-template-columns:1fr; } }

  .panel{
    background:rgba(30,24,17,0.5);
    border:1px solid var(--line);
    border-radius:3px;
  }

  /* ---- map ---- */
  #mapPanel{ padding:18px; }
  #mapPanel h2{ font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:var(--parchment-dim); margin:0 0 12px; font-weight:500;}
  svg{ width:100%; height:auto; display:block; }

  .continent{ cursor:pointer; stroke:var(--line); stroke-width:1.5; transition:filter 0.2s ease, transform 0.2s ease; }
  .continent:hover{ filter:brightness(1.25); }
  .continent.siege{ animation:siegeGlow 1.6s infinite; }
  @keyframes siegeGlow{
    0%,100%{ filter:brightness(1) drop-shadow(0 0 0px var(--siege-bright)); }
    50%{ filter:brightness(1.3) drop-shadow(0 0 10px var(--siege-bright)); }
  }
  .clabel{ font-family:'Cinzel', serif; font-size:11px; fill:var(--parchment); pointer-events:none; letter-spacing:0.05em; }
  .cruler{ font-family:'EB Garamond', serif; font-style:italic; font-size:9.5px; fill:var(--parchment-dim); pointer-events:none; }

  /* ---- tooltip ---- */
  #tooltip{
    position:fixed; pointer-events:none; z-index:50;
    background:#100c08; border:1px solid var(--gold); border-radius:2px;
    padding:10px 14px; font-size:13px; color:var(--parchment);
    box-shadow:0 6px 24px rgba(0,0,0,0.5); display:none; max-width:220px;
  }
  #tooltip .t-name{ font-family:'Cinzel',serif; color:var(--gold-bright); font-size:13px; display:block; margin-bottom:4px;}
  #tooltip .t-row{ color:var(--parchment-dim); font-size:12px; }

  /* ---- legend / sidebar ---- */
  #legendPanel{ padding:18px; }
  #legendPanel h2{ font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:var(--parchment-dim); margin:0 0 14px; font-weight:500;}
  .territory-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--line); gap:10px;
  }
  .territory-row:last-child{ border-bottom:none; }
  .t-left{ display:flex; align-items:center; gap:10px; }
  .swatch{ width:12px; height:12px; border-radius:2px; flex-shrink:0; border:1px solid rgba(0,0,0,0.4);}
  .t-title{ font-family:'Cinzel', serif; font-size:13px; color:var(--parchment); }
  .t-ruler{ font-style:italic; color:var(--parchment-dim); font-size:12px; display:block; }
  .t-status{ font-size:11px; letter-spacing:0.05em; text-transform:uppercase; }
  .t-status.owned{ color:var(--claimed); }
  .t-status.unclaimed{ color:var(--parchment-dim); }
  .t-status.siege{ color:var(--siege-bright); font-weight:600; }

  footer{ margin-top:30px; color:var(--parchment-dim); font-size:12.5px; text-align:center; font-style:italic; }
  footer a{ color:var(--gold); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>The Realm</h1>
      <div class="sub">Seven continents. Seven crowns. Hover a territory to see who rules it.</div>
    </div>
    <div class="sub" id="lastUpdated">Map data last edited manually</div>
  </header>

  <div id="siegeBar">
    <span class="dot"></span><span id="siegeText">No territories currently under siege.</span>
  </div>

  <div class="layout">
    <div class="panel" id="mapPanel">
      <h2>Territory Map</h2>
      <svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
        <!-- ocean texture lines -->
        <rect x="0" y="0" width="700" height="500" fill="none"/>

        <!-- 7 continents as irregular blobs -->
        <path id="c1" class="continent" d="M60,60 L150,40 L200,80 L190,150 L120,170 L50,140 Z"></path>
        <path id="c2" class="continent" d="M280,30 L380,20 L420,70 L390,130 L310,140 L260,90 Z"></path>
        <path id="c3" class="continent" d="M480,50 L580,60 L610,120 L560,170 L490,150 L460,100 Z"></path>
        <path id="c4" class="continent" d="M40,240 L130,220 L170,270 L140,340 L60,350 L20,290 Z"></path>
        <path id="c5" class="continent" d="M250,220 L340,210 L380,270 L340,330 L260,340 L220,280 Z"></path>
        <path id="c6" class="continent" d="M460,230 L560,220 L610,280 L580,350 L490,350 L450,290 Z"></path>
        <path id="c7" class="continent" d="M220,380 L330,370 L390,420 L350,470 L250,480 L190,430 Z"></path>

        <!-- labels populated by JS -->
        <g id="labels"></g>
      </svg>
    </div>

    <div class="panel" id="legendPanel">
      <h2>Territories</h2>
      <div id="territoryList"></div>
    </div>
  </div>

  <footer>
    Map updates are edited by hand in <code>data.js</code> for now — live siege tracking gets wired in next.
  </footer>
</div>

<div id="tooltip"></div>

<script src="data.js"></script>
<script>
  const svgNS = "http://www.w3.org/2000/svg";
  const labelGroup = document.getElementById('labels');
  const listEl = document.getElementById('territoryList');
  const tooltip = document.getElementById('tooltip');
  const siegeBar = document.getElementById('siegeBar');
  const siegeText = document.getElementById('siegeText');

  const pathCenters = {}; // computed rough centers for label placement
  const bboxes = { c1:[125,105], c2:[340,80], c3:[535,110], c4:[95,285], c5:[300,275], c6:[530,285], c7:[290,425] };

  function colorFor(t){
    if(t.siege) return 'var(--siege)';
    if(t.ruler) return t.color || 'var(--claimed)';
    return 'var(--unclaimed)';
  }

  function render(){
    let activeSieges = [];
    territories.forEach(t => {
      const el = document.getElementById(t.id);
      el.style.fill = colorFor(t);
      el.classList.toggle('siege', !!t.siege);

      // label
      const [cx, cy] = bboxes[t.id];
      const name = document.createElementNS(svgNS,'text');
      name.setAttribute('x', cx); name.setAttribute('y', cy - 4);
      name.setAttribute('text-anchor','middle'); name.setAttribute('class','clabel');
      name.textContent = t.name;
      labelGroup.appendChild(name);

      const ruler = document.createElementNS(svgNS,'text');
      ruler.setAttribute('x', cx); ruler.setAttribute('y', cy + 12);
      ruler.setAttribute('text-anchor','middle'); ruler.setAttribute('class','cruler');
      ruler.textContent = t.ruler ? ('ruled by ' + t.ruler) : 'unclaimed';
      labelGroup.appendChild(ruler);

      // hover tooltip
      el.addEventListener('mousemove', (e) => {
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 16) + 'px';
        tooltip.style.top = (e.clientY + 16) + 'px';
        tooltip.innerHTML = `
          <span class="t-name">${t.name}</span>
          <span class="t-row">Ruler: ${t.ruler || '— unclaimed —'}</span>
          <span class="t-row">Tax rate: ${t.ruler ? (t.taxPercent + '%') : '—'}</span>
          <span class="t-row">Status: ${t.siege ? 'UNDER SIEGE' : (t.ruler ? 'owned' : 'unclaimed')}</span>
        `;
      });
      el.addEventListener('mouseleave', () => tooltip.style.display = 'none');

      // sidebar row
      const row = document.createElement('div');
      row.className = 'territory-row';
      const statusClass = t.siege ? 'siege' : (t.ruler ? 'owned' : 'unclaimed');
      const statusLabel = t.siege ? 'Under siege' : (t.ruler ? 'Owned' : 'Unclaimed');
      row.innerHTML = `
        <div class="t-left">
          <span class="swatch" style="background:${colorFor(t)}"></span>
          <div>
            <span class="t-title">${t.name}</span>
            <span class="t-ruler">${t.ruler ? t.ruler : 'no ruler yet'}</span>
          </div>
        </div>
        <span class="t-status ${statusClass}">${statusLabel}</span>
      `;
      listEl.appendChild(row);

      if(t.siege) activeSieges.push(t.name);
    });

    if(activeSieges.length > 0){
      siegeBar.classList.add('active');
      siegeText.textContent = 'Under attack: ' + activeSieges.join(', ');
    } else {
      siegeBar.classList.remove('active');
      siegeText.textContent = 'No territories currently under siege.';
    }
  }

  render();
</script>
</body>
</html>
